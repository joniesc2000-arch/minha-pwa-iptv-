<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPTV Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #121212; color: #fff; margin: 0; padding: 16px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 8px; border: 1px solid #333; box-sizing: border-box; }
    button { background: #e5e5e5; color: #000; font-weight: bold; border: none; cursor: pointer; }
    .channel-item { padding: 12px; border-bottom: 1px solid #222; cursor: pointer; }
    video { width: 100%; height: 220px; background: #000; border-radius: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>

  <video id="videoPlayer" controls playsinline webkit-playsinline></video>

  <h2>Entrar no Xtream</h2>
  <input type="text" id="server" placeholder="http://exemplo.com:8080">
  <input type="text" id="username" placeholder="Utilizador">
  <input type="password" id="password" placeholder="Palavra-passe">
  <button id="btnLogin">Carregar Canais</button>

  <div id="channels" style="margin-top: 20px;"></div>

  <script src="app.js"></script>
</body>
</html>
